
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weapon Detection System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #243b55;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .upload-box {
            border: 2px dashed #243b55;
            padding: 30px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 15px;
        }

        button {
            background: #243b55;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            background: #141e30;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            color: #155724;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffe5e5;
            color: #b00020;
            border-radius: 8px;
        }

        h2 {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weapon Detection System</h1>

        <p class="description">
            Upload an image to identify the weapon
            using our CNN Deep Learning model.
        </p>

        <form method="POST"
              action="/"
              enctype="multipart/form-data">

            <div class="upload-box">

                <h3>Select Weapon Image</h3>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                    required
                >

            </div>

            <button type="submit">
                Detect Weapon
            </button>

        </form>

        {% if prediction %}

        <div class="result">

            <h2>Detection Result</h2>

            <h3>Weapon: {{ prediction }}</h3>

            <p>
                Confidence: {{ confidence }}%
            </p>

        </div>

        {% endif %}

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>
</html>
